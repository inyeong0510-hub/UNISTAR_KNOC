  document.getElementById('foot').textContent =
    '출처: 한국석유공사 「일반 석유상식」(공공데이터포털 개방자료, PDF ' + '10개 파일). '
    + '문항과 해설은 원문 서술을 근거로 작성했습니다.';

  function esc(s){ return s.replace(/[&<>]/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;'})[c]; }); }

  function question(){
    var q = Q[i];
    var h = '<div class="meter"><i style="width:'+(i/Q.length*100)+'%"></i></div>'
      + '<div class="qtop"><span class="tag">'+esc(q.c)+'</span>'
      + '<span class="count">'+(i+1)+' / '+Q.length+'</span></div>'
      + '<p class="q">'+esc(q.q)+'</p><div class="opts" id="opts"></div><div id="after"></div>';
    stage.innerHTML = h;
    var box = document.getElementById('opts');
    q.o.forEach(function(t, k){
      var b = document.createElement('button');
      b.type='button'; b.className='opt';
      b.innerHTML = '<span class="mk">'+AB[k]+'</span><span>'+esc(t)+'</span>';
      b.onclick = function(){ answer(k); };
      box.appendChild(b);
    });
  }

  function answer(k){
    var q = Q[i], opts = document.querySelectorAll('.opt');
    opts.forEach(function(b, n){
      b.disabled = true;
      if(n === q.a) b.classList.add('ok');
      else if(n === k) b.classList.add('no');
    });
    log.push({ q:q, pick:k, ok:(k === q.a) });
    var last = (i === Q.length - 1);
    document.getElementById('after').innerHTML =
      '<div class="exp"><b>'+(k===q.a ? '정답입니다.' : '정답은 '+AB[q.a]+'.')+'</b> '+esc(q.e)
      + '<span class="src">원문 ' + esc(q.s) + '</span></div>'
      + '<div class="act"><button class="go" id="next">'+(last ? '결과 보기' : '다음 문항')+'</button></div>';
    var nx = document.getElementById('next');
    nx.focus();
    nx.onclick = function(){ i++; if(i < Q.length) question(); else result(); };
  }

  function result(){
    var n = log.filter(function(x){ return x.ok; }).length, p = Math.round(n/Q.length*100);
    var g = p>=90 ? ['석유 전문가','원문을 거의 다 짚으셨습니다.']
          : p>=70 ? ['상식 우등','큰 줄기는 확실히 잡고 계십니다.']
          : p>=50 ? ['입문 통과','절반 이상 맞히셨습니다. 틀린 문항만 다시 보세요.']
                  : ['다시 도전','해설을 훑어보고 한 번 더 풀어보세요.'];
    var h = '<div class="score"><div class="n">'+n+' / '+Q.length+'</div>'
      + '<div class="g">'+g[0]+' · '+p+'점</div><div class="d">'+g[1]+'</div></div><div class="review">';
    log.forEach(function(x, k){
      h += '<div class="rv '+(x.ok?'ok':'no')+'"><span class="ic">'+(x.ok?'✓':'✕')+'</span>'
         + '<span><b>'+(k+1)+'.</b> '+esc(x.q.q)
         + (x.ok ? '' : '<br><span style="color:var(--muted)">정답 — '+esc(x.q.o[x.q.a])+'</span>')
         + '</span></div>';
    });
    h += '</div><div class="act"><button class="go" id="again">다시 풀기</button></div>';
    stage.innerHTML = h;
    document.getElementById('again').onclick = function(){ i=0; log=[]; question(); };
  }

  question();
})();
</script><button class="themebtn" id="themebtn" type="button" aria-label="밝게 또는 어둡게 전환" title="밝게/어둡게">

</button>
