<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="한국석유공사 개방데이터로 만든 전국 요소수 평균판매가격 대시보드">

<style>
  :root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  body{margin:0;font:14px/1.5 system-ui,-apple-system,sans-serif;background:#f9f9f7}
  img{max-width:100%}
  [hidden]{display:none!important}
</style>
<title>요소수 가격 지도</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Outfit:wght@400;500;600;700&display=swap">
<style>
:root{
  --plane:#eef3fb; --card:#ffffff; --rail:#1c1d22; --rail-ink:#8e93a0; --rail-on:#ffffff;
  --ink:#10131a; --ink2:#5a6170; --muted:#8b93a3; --line:#e4e9f2;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --tile-a:#ede9fb; --tile-b:#dcf2e6; --tile-c:#fbf1d9;
  --tile-a-ink:#4a3aa7; --tile-b-ink:#0f7a55; --tile-c-ink:#8a6200;
  --ramp-1:#cde2fb; --ramp-2:#9ec5f4; --ramp-3:#6da7ec; --ramp-4:#3987e5; --ramp-5:#256abf; --ramp-6:#184f95;
  --shadow:0 1px 2px rgba(16,19,26,.04), 0 8px 24px rgba(16,19,26,.06);
  --r:18px;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  color-scheme:dark;
  --plane:#0e1014; --card:#1f2024; --rail:#16171b; --rail-ink:#787e8c; --rail-on:#ffffff;
  --ink:#f3f5f8; --ink2:#b3b9c6; --muted:#868d9b; --line:#2e3037;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  --tile-a:#262338; --tile-b:#16302a; --tile-c:#302819;
  --tile-a-ink:#b4a9f5; --tile-b-ink:#5fd3a4; --tile-c-ink:#e8b74a;
  --ramp-1:#184f95; --ramp-2:#256abf; --ramp-3:#2a78d6; --ramp-4:#3987e5; --ramp-5:#6da7ec; --ramp-6:#9ec5f4;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --plane:#0e1014; --card:#1f2024; --rail:#16171b; --rail-ink:#787e8c; --rail-on:#ffffff;
  --ink:#f3f5f8; --ink2:#b3b9c6; --muted:#868d9b; --line:#2e3037;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  --tile-a:#262338; --tile-b:#16302a; --tile-c:#302819;
  --tile-a-ink:#b4a9f5; --tile-b-ink:#5fd3a4; --tile-c-ink:#e8b74a;
  --ramp-1:#184f95; --ramp-2:#256abf; --ramp-3:#2a78d6; --ramp-4:#3987e5; --ramp-5:#6da7ec; --ramp-6:#9ec5f4;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--plane);color:var(--ink);
  font-family:"Noto Sans KR","Outfit",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.num{font-family:"Outfit","Noto Sans KR",sans-serif;font-variant-numeric:tabular-nums}
.shell{display:flex;gap:16px;padding:16px;max-width:1280px;margin:0 auto;align-items:flex-start}
/* rail */
.rail{background:var(--rail);border-radius:22px;padding:18px 12px;display:flex;flex-direction:column;
  gap:22px;align-items:center;position:sticky;top:env(safe-area-inset-top,0px);flex:0 0 64px}
.logo{width:38px;height:38px;border-radius:12px;background:#fdf3d8;display:grid;place-items:center;color:#1c1d22}
.rail nav{display:flex;flex-direction:column;gap:6px;align-items:center}
.rail button{width:40px;height:40px;border:0;border-radius:12px;background:transparent;color:var(--rail-ink);
  display:grid;place-items:center;cursor:pointer}
.rail button[aria-current="true"]{background:rgba(255,255,255,.12);color:var(--rail-on)}
.rail button:hover{color:var(--rail-on)}
.rail button:focus-visible{outline:2px solid #6da7ec;outline-offset:2px}
/* main */
.main{flex:1;min-width:0;display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:4px 2px}
h1{font-family:"Outfit","Noto Sans KR",sans-serif;font-size:26px;font-weight:700;margin:0;letter-spacing:-.02em;text-wrap:balance}
.sub{color:var(--ink2);font-size:12.5px;margin-top:3px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:12px;
  color:var(--ink2);box-shadow:var(--shadow);white-space:nowrap}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.grid-a{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:14px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tile{border-radius:var(--r);padding:15px 15px 17px;display:flex;flex-direction:column;gap:2px;min-height:118px}
.tile.a{background:var(--tile-a)} .tile.b{background:var(--tile-b)} .tile.c{background:var(--tile-c)}
.tile .k{font-size:11.5px;font-weight:500;letter-spacing:.02em}
.tile.a .k{color:var(--tile-a-ink)} .tile.b .k{color:var(--tile-b-ink)} .tile.c .k{color:var(--tile-c-ink)}
.tile .v{font-family:"Outfit",sans-serif;font-variant-numeric:tabular-nums;font-size:25px;font-weight:700;
  letter-spacing:-.02em;margin-top:auto;color:var(--ink)}
.tile .n{font-size:11.5px;color:var(--ink2)}
.hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:2px;flex-wrap:wrap}
h2{font-family:"Outfit","Noto Sans KR",sans-serif;font-size:16px;font-weight:600;margin:0;letter-spacing:-.01em}
.seg{display:flex;gap:3px;background:var(--plane);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:var(--ink2);font-size:11.5px;padding:5px 11px;border-radius:999px;cursor:pointer;
  font-family:inherit}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(16,19,26,.08)}
.seg button:focus-visible{outline:2px solid var(--s1);outline-offset:1px}
.big{font-family:"Outfit",sans-serif;font-variant-numeric:tabular-nums;font-size:34px;font-weight:700;letter-spacing:-.025em;line-height:1.1}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:3px;display:inline-block}
figure{margin:0}
.plot{position:relative}
.plot svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--rail);color:#fff;border-radius:11px;padding:9px 11px;
  font-size:11.5px;line-height:1.55;white-space:nowrap;opacity:0;transition:opacity .12s;z-index:5;
  font-variant-numeric:tabular-nums;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.tip b{font-weight:600}
.rows{display:flex;flex-direction:column;gap:7px;margin-top:12px}
.row{display:grid;grid-template-columns:22px 62px minmax(90px,1fr) 74px;align-items:center;gap:10px;
  border:0;background:transparent;padding:4px 2px;border-radius:10px;cursor:pointer;text-align:left;font-family:inherit;color:inherit}
.row:hover{background:var(--plane)}
.row[aria-pressed="true"]{background:var(--plane);box-shadow:inset 0 0 0 1.5px var(--s1)}
.row:focus-visible{outline:2px solid var(--s1);outline-offset:1px}
.rank{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.rname{font-size:13px;font-weight:500}
.bar{height:9px;background:var(--plane);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:0 5px 5px 0}
.rval{font-size:13px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums;font-family:"Outfit",sans-serif}
.note{background:var(--rail);color:#fff;border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:10px}
.note h3{font-family:"Outfit","Noto Sans KR",sans-serif;font-size:17px;margin:0;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
.note p{margin:0;font-size:12.5px;line-height:1.65;color:#c8ccd6}
.note .kpi{font-family:"Outfit",sans-serif;font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.note .src{font-size:11px;color:#7e8492;margin-top:auto;padding-top:8px}
table{border-collapse:collapse;width:100%;font-size:12px;font-variant-numeric:tabular-nums}
th,td{padding:6px 9px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card)}
thead th{color:var(--ink2);font-weight:600;font-size:11px}
.scroll{overflow-x:auto;margin-top:10px;max-height:340px;overflow-y:auto}
.foot{color:var(--muted);font-size:11.5px;padding:2px 2px 6px;line-height:1.6}
@media (max-width:900px){
  .grid-a{grid-template-columns:1fr}
  .shell{flex-direction:column;padding:12px;gap:12px}
  .rail{flex-direction:row;width:100%;position:static;flex:none;border-radius:18px;padding:10px 12px;justify-content:flex-start}
  .rail nav{flex-direction:row}
}
@media (max-width:520px){
  .tiles{grid-template-columns:1fr}
  h1{font-size:21px} .big{font-size:28px}
  .row{grid-template-columns:20px 54px minmax(60px,1fr) 66px;gap:8px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>
.themebtn{position:fixed;right:14px;bottom:14px;z-index:20;width:42px;height:42px;border-radius:50%;
  border:1px solid var(--line);background:var(--card);color:var(--ink2);cursor:pointer;box-shadow:var(--shadow);
  display:grid;place-items:center}
.themebtn:hover{color:var(--ink)}
.themebtn:focus-visible{outline:2px solid var(--s1);outline-offset:2px}
@media print{.themebtn{display:none}}
</style>

<style>
.sitenav{max-width:1280px;margin:0 auto;padding:14px 16px 0;display:flex;align-items:center;
  justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px}
.sitenav>a{font-weight:700;color:var(--ink);text-decoration:none;letter-spacing:-.01em}
.sitenav span{display:flex;gap:6px}
.sitenav span a{color:var(--ink2);text-decoration:none;padding:6px 12px;border-radius:999px;
  background:var(--card);border:1px solid var(--line)}
.sitenav span a:hover{color:var(--ink)}
.sitenav span a[aria-current="page"]{color:var(--ink);font-weight:600;border-color:var(--s1)}
</style>
</head>

      <button type="button" data-view="table" aria-current="false" title="표로 보기"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 10v10"/></svg></button>
    </nav>
  </aside>

  <main class="main">
    <div class="top">
      <div>
        <h1>요소수 가격 지도</h1>
        <div class="sub">전국 주유소 요소수 평균판매가격 · <span id="period" class="num"></span></div>
      </div>
      <div class="chip">기준 <b id="asof" class="num"></b> · 공공데이터포털 개방데이터</div>
    </div>

    <section class="grid-a" id="view-chart">
      <div class="card">
        <div class="hd">
          <div>
            <h2 id="chartTitle">전국 평균 추이</h2>
            <div class="big" id="natNow"></div>
            <div class="sub" id="natDelta"></div>
          </div>
          <div class="seg" role="group" aria-label="기간 선택">
            <button type="button" data-span="12" aria-pressed="false">1년</button>
            <button type="button" data-span="36" aria-pressed="false">3년</button>
            <button type="button" data-span="0" aria-pressed="true">전체</button>
          </div>
        </div>
        <figure class="plot" id="plot">
          <svg id="chart" viewBox="0 0 720 260" role="img" aria-label="선그래프"></svg>
          <div class="tip" id="tip"></div>
        </figure>
        <div class="legend" id="legend"></div>
      </div>

      <div class="tiles" style="grid-template-columns:1fr">
        <div class="tile a"><div class="k">최고가 지역</div><div class="v num" id="hiV"></div><div class="n" id="hiN"></div></div>
        <div class="tile b"><div class="k">최저가 지역</div><div class="v num" id="loV"></div><div class="n" id="loN"></div></div>
        <div class="tile c"><div class="k">최고−최저 격차</div><div class="v num" id="gapV"></div><div class="n" id="gapN"></div></div>
      </div>
    </section>

    <section class="grid-a">
      <div class="card">
        <div class="hd">
          <h2 id="rankTitle">지역별 순위</h2>
          <span class="sub">행을 누르면 위 그래프에 추가됩니다 (최대 2개)</span>
        </div>
        <div class="rows" id="rows"></div>
      </div>
      <div class="note">
        <h3>같은 요소수인데 지역에 따라 값이 다릅니다</h3>
        <div class="kpi" id="noteKpi"></div>
        <p id="noteBody"></p>
        <p class="src" id="noteSrc"></p>
      </div>
    </section>

    <section class="card" id="view-table" hidden>
      <div class="hd"><h2>원자료 보기</h2><span class="sub">단위 원/L · 월말 평균</span></div>
      <div class="scroll"><table id="tbl"></table></div>
    </section>

    <p class="foot" id="foot"></p>
  </main>

  var fmt = function(v){ return v==null?'—':v.toLocaleString('ko-KR',{maximumFractionDigits:0}); };
  var ym = function(s){ var p=s.split('-'); return p[0].slice(2)+'.'+p[1]; };

  var mode = 'region';                 // region | brand
  var span = 0;                        // 0 = 전체
  var picks = [];                      // 비교 대상(최대 2)
  var SLOT = ['--s1','--s2','--s3'];

  function ds(){ return mode==='region' ? D.region : D.brand; }
  function names(){ return ds().cols.filter(function(c){ return c!=='전국'; }); }
  function latest(c){ var a=ds().series[c]; return a[a.length-1]; }

  function init(){
    document.getElementById('period').textContent = D.period.replace(/-/g,'.');
    document.getElementById('asof').textContent = ds().dates[ds().dates.length-1].replace(/-/g,'.');
    document.getElementById('foot').textContent =
      '출처 ' + D.source + '. 값은 각 월말 기준 평균판매가격(원/L)이며, 원자료를 가공하지 않고 그대로 표시했습니다.';
    var hi = names().slice().sort(function(a,b){ return latest(b)-latest(a); });
    picks = [hi[0], hi[hi.length-1]];
    draw();
  }

  function draw(){ tiles(); chart(); rank(); note(); table(); }

  function tiles(){
    var n = names().slice().sort(function(a,b){ return latest(b)-latest(a); });
    var hi=n[0], lo=n[n.length-1];
    document.getElementById('hiV').textContent = fmt(latest(hi))+'원';
    document.getElementById('hiN').textContent = hi + ' · 전국 평균 대비 +' + fmt(latest(hi)-latest('전국')) + '원';
    document.getElementById('loV').textContent = fmt(latest(lo))+'원';
    document.getElementById('loN').textContent = lo + ' · 전국 평균 대비 ' + fmt(latest(lo)-latest('전국')) + '원';
    var gap = latest(hi)-latest(lo);
    document.getElementById('gapV').textContent = fmt(gap)+'원';
    document.getElementById('gapN').textContent = (latest(hi)/latest(lo)).toFixed(2) + '배 · 10L 충전 시 ' + fmt(gap*10) + '원 차이';
  }

  function slice(arr){ return span ? arr.slice(-span) : arr; }

  function chart(){
    var d = ds(), dates = slice(d.dates);
    var series = ['전국'].concat(picks.filter(Boolean)).slice(0,3);
    var W=720, H=260, mL=46, mR=58, mT=14, mB=26;
    var vals=[]; series.forEach(function(s){ slice(d.series[s]).forEach(function(v){ if(v!=null) vals.push(v); }); });
    var min=Math.min.apply(null,vals), max=Math.max.apply(null,vals);
    var pad=(max-min)*0.18 || 50; min=Math.floor((min-pad)/50)*50; max=Math.ceil((max+pad)/50)*50;
    var x=function(i){ return mL + i*(W-mL-mR)/Math.max(1,dates.length-1); };
    var y=function(v){ return mT + (max-v)*(H-mT-mB)/(max-min); };
    var g='', ticks=4;
    for(var t=0;t<=ticks;t++){
      var v=min+(max-min)*t/ticks, yy=y(v);
      g+='<line x1="'+mL+'" y1="'+yy+'" x2="'+(W-mR)+'" y2="'+yy+'" stroke="'+css('--line')+'" stroke-width="1"/>'+
         '<text x="'+(mL-9)+'" y="'+(yy+4)+'" text-anchor="end" font-size="10.5" fill="'+css('--muted')+'" font-family="Outfit,sans-serif">'+fmt(v)+'</text>';
    }
    var step=Math.max(1,Math.ceil(dates.length/7));
    for(var i=0;i<dates.length;i+=step)
      g+='<text x="'+x(i)+'" y="'+(H-6)+'" text-anchor="middle" font-size="10.5" fill="'+css('--muted')+'" font-family="Outfit,sans-serif">'+ym(dates[i])+'</text>';

    series.forEach(function(s,si){
      var col=css(SLOT[si]), a=slice(d.series[s]), p='';
      a.forEach(function(v,i){ if(v==null) return; p += (p?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)+' '; });
      if(si===0){
        var area=p+'L '+x(a.length-1).toFixed(1)+' '+y(min)+' L '+x(0).toFixed(1)+' '+y(min)+' Z';
        g+='<path d="'+area+'" fill="'+col+'" fill-opacity="0.10"/>';
      }
      g+='<path d="'+p+'" fill="none" stroke="'+col+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
      var lv=a[a.length-1];
      if(lv!=null){
        g+='<circle cx="'+x(a.length-1)+'" cy="'+y(lv)+'" r="4.5" fill="'+col+'" stroke="'+css('--card')+'" stroke-width="2"/>'+
           '<text x="'+(x(a.length-1)+9)+'" y="'+(y(lv)+4)+'" font-size="11" font-weight="600" fill="'+css('--ink')+'" font-family="Outfit,sans-serif">'+s+'</text>';
      }
    });
    g+='<g id="cross" opacity="0"><line y1="'+mT+'" y2="'+(H-mB)+'" stroke="'+css('--muted')+'" stroke-width="1" stroke-dasharray="3 3"/></g>';
    var svg=document.getElementById('chart'); svg.innerHTML=g;
    svg.setAttribute('aria-label',
      series.join(', ')+'의 '+dates[0]+'부터 '+dates[dates.length-1]+'까지 월별 평균판매가격 선그래프.');

    var nat=slice(d.series['전국']), now=nat[nat.length-1], first=nat[0];
    document.getElementById('natNow').textContent = fmt(now)+'원';
    var diff=now-first;
    document.getElementById('natDelta').textContent =
      '전국 평균 · ' + ym(dates[0]) + ' 대비 ' + (diff>0?'+':'') + fmt(diff) + '원 (' + (diff/first*100).toFixed(1) + '%)';

    var lg=document.getElementById('legend'); lg.innerHTML='';
    series.forEach(function(s,si){
      var el=document.createElement('span');
      el.innerHTML='<i class="dot" style="background:'+css(SLOT[si])+'"></i>'+s+' <b class="num" style="color:var(--ink)">'+fmt(latest(s))+'</b>';
      lg.appendChild(el);
    });

    var tip=document.getElementById('tip'), plot=document.getElementById('plot');
    function move(ev){
      var r=svg.getBoundingClientRect(), px=(ev.clientX!=null?ev.clientX:ev.touches[0].clientX)-r.left;
      var i=Math.round(((px/r.width*W)-mL)/((W-mL-mR)/Math.max(1,dates.length-1)));
      i=Math.max(0,Math.min(dates.length-1,i));
      var c=svg.querySelector('#cross'); c.setAttribute('opacity','1');
      c.firstChild.setAttribute('x1',x(i)); c.firstChild.setAttribute('x2',x(i));
      var h='<b>'+dates[i]+'</b>';
      series.forEach(function(s,si){ h+='<br><i class="dot" style="background:'+css(SLOT[si])+'"></i> '+s+' <b>'+fmt(d.series[s][span?d.dates.length-dates.length+i:i])+'</b>원'; });
      tip.innerHTML=h; tip.style.opacity='1';
      var left=x(i)/W*r.width; tip.style.left=Math.min(Math.max(8,left+12), r.width-160)+'px'; tip.style.top='6px';
    }
    plot.onmousemove=move; plot.ontouchmove=function(e){ move(e); };
    plot.onmouseleave=function(){ tip.style.opacity='0'; var c=svg.querySelector('#cross'); if(c) c.setAttribute('opacity','0'); };
  }

  function rank(){
    var n=names().slice().sort(function(a,b){ return latest(b)-latest(a); });
    var mx=latest(n[0]), mn=latest(n[n.length-1]);
    var box=document.getElementById('rows'); box.innerHTML='';
    n.forEach(function(name,i){
      var v=latest(name), t=(v-mn)/Math.max(1,(mx-mn));
      var col=['--ramp-1','--ramp-2','--ramp-3','--ramp-4','--ramp-5','--ramp-6'][Math.min(5,Math.floor(t*6))];
      var b=document.createElement('button');
      b.type='button'; b.className='row'; b.setAttribute('aria-pressed', picks.indexOf(name)>-1 ? 'true':'false');
      b.innerHTML='<span class="rank num">'+(i+1)+'</span><span class="rname">'+name+'</span>'+
        '<span class="bar"><i style="width:'+(8+t*92).toFixed(1)+'%;background:'+css(col)+'"></i></span>'+
        '<span class="rval">'+fmt(v)+'</span>';
      b.onclick=function(){
        var k=picks.indexOf(name);
        if(k>-1) picks.splice(k,1); else { picks.push(name); if(picks.length>2) picks.shift(); }
        draw();
      };
      box.appendChild(b);
    });
    document.getElementById('rankTitle').textContent = (mode==='region'?'지역별':'상표별')+' 순위';
  }

  function note(){
    var n=names().slice().sort(function(a,b){ return latest(b)-latest(a); });
    var hi=n[0], lo=n[n.length-1], gap=latest(hi)-latest(lo);
    document.getElementById('noteKpi').textContent = fmt(gap)+'원 · '+(latest(hi)/latest(lo)).toFixed(2)+'배';
    document.getElementById('noteBody').textContent = mode==='region'
      ? hi+'('+fmt(latest(hi))+'원)와 '+lo+'('+fmt(latest(lo))+'원)의 차이입니다. 요소수는 경유 화물차에 반드시 필요한 소모품이지만 유가만큼 알려져 있지 않아, 어느 지역에서 넣는 것이 유리한지 모른 채 구매하게 됩니다. 10L를 충전하면 지역 선택만으로 '+fmt(gap*10)+'원이 갈립니다.'
      : hi+'('+fmt(latest(hi))+'원)와 '+lo+'('+fmt(latest(lo))+'원)의 차이입니다. 같은 제품인데 상표에 따라 값이 벌어지며, 알뜰 계열이 대체로 아래쪽에 모여 있습니다.';
    document.getElementById('noteSrc').textContent = D.source;
  }

  function table(){
    var d=ds(), cols=d.cols, rows=slice(d.dates);
    var off=span?d.dates.length-rows.length:0;
    var h='<thead><tr><th>기간</th>'+cols.map(function(c){ return '<th>'+c+'</th>'; }).join('')+'</tr></thead><tbody>';
    for(var i=rows.length-1;i>=0;i--){
      h+='<tr><td>'+rows[i]+'</td>'+cols.map(function(c){ return '<td>'+fmt(d.series[c][off+i])+'</td>'; }).join('')+'</tr>';
    }
    document.getElementById('tbl').innerHTML=h+'</tbody>';
  }

  document.querySelectorAll('.seg button').forEach(function(b){
    b.onclick=function(){
      document.querySelectorAll('.seg button').forEach(function(o){ o.setAttribute('aria-pressed','false'); });
      b.setAttribute('aria-pressed','true'); span=+b.dataset.span; draw();
    };
  });
  document.querySelectorAll('.rail button').forEach(function(b){
    b.onclick=function(){
      var v=b.dataset.view;
      document.querySelectorAll('.rail button').forEach(function(o){ o.setAttribute('aria-current','false'); });
      b.setAttribute('aria-current','true');
      var t=document.getElementById('view-table');
      if(v==='table'){ t.hidden=false; t.scrollIntoView({behavior:'smooth',block:'nearest'}); return; }
      t.hidden=true; mode=v;
      var hi=names().slice().sort(function(a,b2){ return latest(b2)-latest(a); });
      picks=[hi[0],hi[hi.length-1]];
      document.getElementById('chartTitle').textContent='전국 평균 추이';
      draw();
    };
  });
  window.addEventListener('resize', function(){ chart(); });
  init();
})();
</script>
<button class="themebtn" id="themebtn" type="button" title="밝게/어둡게" aria-label="밝게 또는 어둡게 전환">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
</button>
<script>
(function(){
  var r=document.documentElement, b=document.getElementById('themebtn');
  var saved=null; try{ saved=localStorage.getItem('urea-theme'); }catch(e){}
  if(saved) r.setAttribute('data-theme',saved);
  b.addEventListener('click',function(){
    var dark=r.getAttribute('data-theme')==='dark'
      || (!r.getAttribute('data-theme') && matchMedia('(prefers-color-scheme:dark)').matches);
    var next=dark?'light':'dark';
    r.setAttribute('data-theme',next);
    try{ localStorage.setItem('urea-theme',next); }catch(e){}
  });
})();
</script>

</body>
</html>
